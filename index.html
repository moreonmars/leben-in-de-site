<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Leben has moved</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://lebenapp.moonage.me/">
  <meta http-equiv="refresh" content="0; url=https://lebenapp.moonage.me/">
  <script>
    // Old links point at #privacy, #delete-account or #support; send them to the same place on the new site,
    // in German or Ukrainian when that is the browser language.
    var site = 'https://lebenapp.moonage.me';
    var l = ((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase().slice(0, 2);
    var base = site + (l === 'de' || l === 'uk' ? '/' + l + '/' : '/');
    var h = location.hash;
    var to = base;
    if (h === '#privacy') to = base + 'privacy/';
    else if (h === '#delete-account') to = base + 'privacy/#delete-account';
    else if (h === '#support') to = base + '#support';
    location.replace(to);
  </script>
</head>
<body>
  <p>Leben has moved to <a href="https://lebenapp.moonage.me/">lebenapp.moonage.me</a>.
  Privacy policy: <a href="https://lebenapp.moonage.me/privacy/">lebenapp.moonage.me/privacy</a>.</p>
</body>
</html>
