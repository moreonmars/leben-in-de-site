<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#181715" />

  <title>Leben in Deutschland</title>
  <meta
    name="description"
    content="Multilingual preparation for Leben in Deutschland and the German naturalisation test."
  />

  <style>
    :root {
      color-scheme: light dark;
      --ink: #181715;
      --ink-soft: #59564f;
      --paper: #f8f5ed;
      --paper-2: #eee9dd;
      --card: rgba(255, 253, 247, 0.88);
      --line: rgba(24, 23, 21, 0.10);
      --gold: #d99c2b;
      --gold-soft: #f1dfb1;
      --red: #a62a31;
      --shadow: 0 24px 70px rgba(32, 28, 20, 0.10);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 78% 4%, rgba(217, 156, 43, 0.18), transparent 29rem),
        radial-gradient(circle at 5% 32%, rgba(166, 42, 49, 0.055), transparent 25rem),
        var(--paper);
    }

    a { color: inherit; }

    .page {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 22px 0 52px;
    }

    .nav {
      position: sticky;
      top: 12px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 62px;
      padding: 10px 12px 10px 16px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(248, 245, 237, 0.80);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 10px 35px rgba(28, 25, 19, 0.07);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .brand-mark {
      width: 39px;
      height: 39px;
      object-fit: contain;
      filter: drop-shadow(0 5px 10px rgba(26, 23, 18, 0.15));
    }

    .brand-title {
      font-size: 17px;
    }

    select {
      appearance: none;
      min-width: 150px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background:
        linear-gradient(45deg, transparent 50%, var(--gold) 50%) calc(100% - 18px) 50% / 5px 5px no-repeat,
        linear-gradient(135deg, var(--gold) 50%, transparent 50%) calc(100% - 13px) 50% / 5px 5px no-repeat,
        rgba(255,255,255,.58);
      color: var(--ink);
      padding: 11px 38px 11px 13px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(310px, .8fr);
      gap: clamp(36px, 8vw, 96px);
      align-items: center;
      padding: clamp(64px, 10vw, 124px) 0 84px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 22px;
      padding: 9px 12px;
      border-radius: 999px;
      background: #181715;
      color: #fffaf0;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .flag-dot {
      width: 24px;
      height: 8px;
      border-radius: 99px;
      background: linear-gradient(to bottom, #181715 0 33%, #a62a31 33% 66%, #d99c2b 66%);
      outline: 1px solid rgba(255,255,255,.18);
    }

    h1 {
      margin: 0;
      max-width: 760px;
      font-size: clamp(48px, 8.7vw, 104px);
      line-height: .91;
      letter-spacing: -.067em;
      text-wrap: balance;
    }

    .intro {
      max-width: 660px;
      margin: 28px 0 0;
      color: var(--ink-soft);
      font-size: clamp(18px, 2.1vw, 23px);
      line-height: 1.5;
      text-wrap: pretty;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 11px;
      margin-top: 32px;
    }

    .button {
      display: inline-flex;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border-radius: 16px;
      text-decoration: none;
      font-weight: 760;
    }

    .button-primary {
      color: #fffaf0;
      background: #181715;
      box-shadow: 0 10px 25px rgba(24,23,21,.14);
    }

    .button-secondary {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.48);
    }

    .icon-stage {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 390px;
    }

    .app-icon {
      position: relative;
      width: min(100%, 390px);
      aspect-ratio: 1;
      object-fit: contain;
      filter: drop-shadow(0 28px 38px rgba(34, 29, 20, .22));
      animation: float 5s ease-in-out infinite;
    }

    @keyframes float {
      0%,100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
    }

    .content-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 18px;
    }

    .card {
      grid-column: span 12;
      padding: clamp(24px, 4vw, 40px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .card:nth-child(2),
    .card:nth-child(3) {
      grid-column: span 6;
    }

    .card-label {
      display: inline-block;
      margin-bottom: 14px;
      color: var(--red);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .09em;
    }

    h2 {
      margin: 0 0 14px;
      font-size: clamp(25px, 3vw, 36px);
      letter-spacing: -.035em;
    }

    p, li {
      color: var(--ink-soft);
      line-height: 1.68;
    }

    ul {
      margin: 20px 0 0;
      padding-inline-start: 22px;
    }

    li + li { margin-top: 9px; }

    .full-policy h2 { margin-bottom: 8px; }
    .full-policy h3 {
      margin: 28px 0 8px;
      font-size: 19px;
      letter-spacing: -.02em;
    }
    .full-policy p { margin: 10px 0; }
    .full-policy ul { margin-top: 10px; }
    .policy-date {
      margin-top: 0;
      color: var(--ink-soft);
      font-size: 14px;
    }
    [hidden] { display: none !important; }

    .support-link {
      display: inline-flex;
      margin-top: 8px;
      padding: 11px 14px;
      border-radius: 13px;
      background: var(--gold-soft);
      color: var(--ink);
      font-weight: 750;
      text-decoration: none;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 30px;
      padding: 24px 4px 0;
      color: #817d72;
      font-size: 13px;
    }

    [dir="rtl"] .nav,
    [dir="rtl"] footer {
      flex-direction: row-reverse;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #f7f2e5;
        --ink-soft: #bdb5a5;
        --paper: #0f0e0d;
        --paper-2: #191714;
        --card: rgba(29, 27, 24, .86);
        --line: rgba(255,255,255,.10);
        --gold-soft: #3a2c14;
        --shadow: 0 24px 80px rgba(0,0,0,.28);
      }

      body {
        background:
          radial-gradient(circle at 78% 4%, rgba(217,156,43,.13), transparent 29rem),
          radial-gradient(circle at 5% 32%, rgba(166,42,49,.08), transparent 25rem),
          var(--paper);
      }

      .nav {
        background: rgba(15,14,13,.78);
      }

      select, .button-secondary {
        background: rgba(255,255,255,.045);
      }

      .app-icon {
        filter:
          drop-shadow(0 26px 50px rgba(0,0,0,.48))
          brightness(.94);
      }

      .eyebrow,
      .button-primary {
        background: #181715;
        color: #fffaf0;
      }

      .button-secondary {
        color: var(--ink);
      }
    }

    @media (max-width: 760px) {
      .page { width: min(100% - 26px, 1120px); }
      .brand-title { display: none; }
      select { min-width: 135px; }
      .hero {
        grid-template-columns: 1fr;
        padding-top: 56px;
        gap: 32px;
      }
      .hero-copy { order: 2; }
      .icon-stage {
        order: 1;
        min-height: 260px;
      }
      .app-icon { width: min(78vw, 310px); }
      .card:nth-child(2),
      .card:nth-child(3) {
        grid-column: span 12;
      }
      footer { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      .app-icon { animation: none; }
      html { scroll-behavior: auto; }
    }
  
    .nav select {
      appearance: none;
      min-width: 170px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 14px;
      background:
        linear-gradient(45deg, transparent 50%, #d99c2b 50%) calc(100% - 18px) 50% / 5px 5px no-repeat,
        linear-gradient(135deg, #d99c2b 50%, transparent 50%) calc(100% - 13px) 50% / 5px 5px no-repeat,
        rgba(255,255,255,.05);
      color: var(--ink);
      padding: 11px 38px 11px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .brand-mark,
    .app-icon {
      background: transparent !important;
    }

    .icon-stage {
      background: transparent !important;
    }

  </style>
</head>

<body>

    <nav class="nav">
      <div class="brand">
        <img class="brand-mark" src="leben-logo.svg" alt="" />
        <span class="brand-title">Leben in Deutschland</span>
      </div>

      <select id="lang" aria-label="Language">
        <option value="de">Deutsch</option>
        <option value="en">English</option>
        <option value="uk">Українська</option>
        <option value="tr">Türkçe</option>
        <option value="ar">العربية</option>
        <option value="pl">Polski</option>
        <option value="ro">Română</option>
        <option value="it">Italiano</option>
        <option value="bg">Български</option>
        <option value="hr">Hrvatski</option>
        <option value="sr">Српски</option>
        <option value="bs">Bosanski</option>
        <option value="fa">فارسی</option>

        <option value="ku">Kurdî</option>

    <section class="hero">

          <a class="button button-secondary" href="#support" data-k="supportLink">Support</a>
        </div>
      </div>

      <div class="icon-stage">
        <img
          class="app-icon"
          src="leben-logo.svg"
          alt="Leben in Deutschland app icon"
        />
      </div>
    </section>

    <div class="content-grid">
      <section class="card" id="privacy">
        <article id="privacy-full" class="full-policy">
          <div id="policy-content"></div>
        </article>
      </section>

      <section class="card" id="support">
          <span class="card-label" data-k="contactLabel">Contact</span>
        <h2 data-k="supportTitle"></h2>
        <p data-k="supportText"></p>
        <a class="support-link" href="mailto:denisvasiluk@gmail.com">
          denisvasiluk@gmail.com
        </a>
      </section>

      <section class="card">
        <span class="card-label" data-k="independentLabel">Independent app</span>
        <h2 data-k="disclaimerTitle"></h2>
        <p data-k="disclaimerText"></p>
      </section>
    </div>

    <footer>
      <span>© 2026 Leben in Deutschland</span>
      <span data-k="flagColors">Schwarz · Rot · Gold</span>
    </footer>
  </main>

de:`<span class="card-label">Datenschutz</span><h2>Datenschutzerklärung — Leben in Deutschland</h2><p class="policy-date"><strong>Zuletzt aktualisiert:</strong> 27. August 2026</p><p>Diese Datenschutzerklärung erläutert, wie Denys Vasyliuk („wir“) Informationen in der App <strong>Leben in Deutschland</strong> verarbeitet.</p><h3>1. Was die App macht</h3><p>Leben in Deutschland ist eine Lern-App zum Üben von Fragen, Erklärungen und Vokabeln sowie zum Verfolgen des Lernfortschritts im Zusammenhang mit dem deutschen Integrations- und Einbürgerungstest.</p><h3>2. Verarbeitete Informationen</h3><h3>Nutzung als Gast</h3><p>Die App kann als Gast genutzt werden. Lernfortschritt, Einstellungen, Lesezeichen und Übungsverlauf können lokal auf dem Gerät gespeichert werden. Gastdaten werden nicht mit einem Konto synchronisiert, solange sich die Person nicht anmeldet.</p><h3>Anmeldung mit Apple oder Google</h3><p>Bei der Anmeldung mit Apple oder Google erstellen der Authentifizierungsanbieter und Supabase eine Konto-ID und eine Sitzung. Je nach Anbieter und Auswahl der Person können dazu E-Mail-Adresse und Name gehören. Diese Informationen dienen der Anmeldung, der Bereitstellung des Kontos und der Synchronisierung des Fortschritts zwischen Geräten.</p><h3>Lerndaten</h3><p>Bei aktivierter Kontosynchronisierung können Lernfortschritt, beantwortete/richtige/falsche Fragen, Lesezeichen, Fehler, Diagnose- und Prüfungssimulationsergebnisse, Tagesziele, ausgewählte Sprachen, Darstellungseinstellungen und andere Lerneinstellungen gespeichert werden.</p><h3>Technische Sitzungsdaten</h3><p>Sitzungstoken werden lokal im Schlüsselbund des Geräts gespeichert und für die Anmeldung sowie die sichere Kommunikation mit Supabase verwendet. Das Sitzungstoken wird nicht für Werbung oder Tracking verwendet.</p><h3>3. Zweck der Verarbeitung</h3><p>Wir verwenden Informationen, um:</p><ul><li>Authentifizierung und Kontozugriff bereitzustellen;</li><li>Lernfortschritt zwischen Geräten zu synchronisieren;</li><li>Katalog, Übungsergebnisse, Lesezeichen, Fehler und Widgets anzuzeigen;</li><li>Sprach- und Darstellungseinstellungen zu speichern;</li><li>Supportanfragen zu beantworten;</li><li>den Dienst zu schützen und fehlgeschlagene Anfragen zu untersuchen.</li></ul><h3>4. Dienstleister</h3><p>Authentifizierung und Cloud-Synchronisierung werden über <strong>Supabase</strong> bereitgestellt. Apple und Google können Informationen verarbeiten, wenn die jeweilige Anmeldung gewählt wird, und zwar nach ihren eigenen Datenschutzrichtlinien.</p><p>Die App verwendet keine Werbung, kein Cross-App-Tracking, keinen Verkauf personenbezogener Daten und keine Analyse-SDKs, sofern diese Erklärung nicht vor Einführung einer solchen Funktion aktualisiert wird.</p><h3>5. Aufbewahrung und Löschung</h3><p>Kontodaten werden gespeichert, solange das Konto aktiv ist oder dies zur Bereitstellung des Dienstes erforderlich ist. Eine Abmeldung ist jederzeit möglich. Authentifizierte Personen können die Löschung unter <strong>Einstellungen → Konto → Konto löschen</strong> anfordern. Die Löschung entfernt Konto, Fortschritt und zugehörige von der App verarbeitete Daten, vorbehaltlich technischer Backups oder gesetzlicher Aufbewahrungspflichten.</p><p>Gastdaten können über die Zurücksetzen-Funktionen der App oder durch Löschen der App vom Gerät entfernt werden.</p><h3>6. Sicherheit</h3><p>Für lokale Sitzungstoken verwenden wir den Schlüsselbund der Plattform und für die Cloud-Synchronisierung authentifizierte Anfragen. Keine Übertragung und keine Speicherung ist vollkommen sicher; wir treffen jedoch angemessene Maßnahmen für den Dienst.</p><h3>7. Kinder</h3><p>Die App ist ein Bildungsangebot und nicht auf die Erhebung von Informationen von Kindern ausgerichtet. Für ein Kind darf ohne die erforderliche Einwilligung kein Konto erstellt werden.</p><h3>8. Änderungen</h3><p>Wir können diese Erklärung aktualisieren, wenn sich die App oder ihre Datenverarbeitung ändert. Die aktualisierte Version wird unter derselben URL mit einem neuen Datum veröffentlicht.</p>`,
en:`<span class="card-label">Privacy</span><h2>Privacy Policy — Leben in Deutschland</h2><p class="policy-date"><strong>Last updated:</strong> August 27, 2026</p><p>This Privacy Policy explains how Denys Vasyliuk (“we”, “us”) handles information in the <strong>Leben in Deutschland</strong> app.</p><h3>1. What the app does</h3><p>Leben in Deutschland is an educational app for practicing questions, explanations, vocabulary and progress related to the German integration/citizenship knowledge test.</p><h3>2. Information we process</h3><h3>Guest use</h3><p>The app can be used as a guest. Learning progress, settings, bookmarks and practice history may be stored locally on the device. Guest data is not synchronized to an account unless the user signs in.</p><h3>Apple or Google sign-in</h3><p>If the user signs in with Apple or Google, the authentication provider and Supabase create an account identifier and session. Depending on the provider and the user’s choices, this may include an email address and name. The app uses this information to authenticate the user, keep the account available and synchronize progress between the user’s devices.</p><h3>Learning data</h3><p>When account synchronization is enabled, the app may store learning progress, answered/correct/incorrect question identifiers, bookmarks, mistakes, diagnostic and mock-exam results, daily goals, selected languages, appearance preferences and other learning settings.</p><h3>Technical session data</h3><p>Session tokens are stored locally in the device Keychain and are used to keep the user signed in and communicate securely with Supabase. The app does not use the session token for advertising or tracking.</p><h3>3. Why we use information</h3><p>We use information to:</p><ul><li>provide authentication and account access;</li><li>synchronize learning progress across devices;</li><li>show the catalog, practice results, bookmarks, mistakes and widgets;</li><li>save language and appearance preferences;</li><li>respond to support requests;</li><li>protect the service and troubleshoot failed requests.</li></ul><h3>4. Service providers</h3><p>Authentication and cloud synchronization are provided through <strong>Supabase</strong>. Apple and Google may process information when the user chooses their sign-in service under their own privacy policies.</p><p>The app does not use advertising, cross-app tracking, sale of personal information, or analytics SDKs unless this policy is updated before such a feature is introduced.</p><h3>5. Data retention and deletion</h3><p>Account data is kept while the account is active or as needed to provide the service. The user can sign out at any time. Authenticated users can request deletion from <strong>Settings → Account → Delete account</strong>. Deletion removes the account, progress and associated data handled by the app, subject to technical backups or legal retention requirements.</p><p>Guest data can be removed by using the app’s reset-progress controls or by deleting the app from the device.</p><h3>6. Security</h3><p>We use the platform Keychain for local session-token storage and authenticated requests for cloud synchronization. No method of transmission or storage is completely secure, but we take reasonable measures appropriate for the service.</p><h3>7. Children</h3><p>The app is an educational tool and is not directed at collecting information from children. Do not create an account on behalf of a child without the necessary permission.</p><h3>8. Changes</h3><p>We may update this policy when the app or its data practices change. The updated version will be published at the same URL with a new “Last updated” date.</p>`,
uk:`<span class="card-label">Конфіденційність</span><h2>Політика конфіденційності — Leben in Deutschland</h2><p class="policy-date"><strong>Останнє оновлення:</strong> 27 серпня 2026 року</p><p>Ця політика пояснює, як Денис Василюк («ми») обробляє інформацію в застосунку <strong>Leben in Deutschland</strong>.</p><h3>1. Що робить застосунок</h3><p>Leben in Deutschland — навчальний застосунок для тренування запитань, перегляду пояснень і словника та відстеження прогресу, пов’язаного з німецьким інтеграційним тестом і тестом на громадянство.</p><h3>2. Яку інформацію ми обробляємо</h3><h3>Гостьове використання</h3><p>Застосунком можна користуватися як гість. Прогрес, налаштування, закладки та історія тренувань можуть зберігатися локально на пристрої. Дані гостя не синхронізуються з обліковим записом, доки користувач не ввійде.</p><h3>Вхід через Apple або Google</h3><p>Якщо користувач входить через Apple або Google, постачальник автентифікації та Supabase створюють ідентифікатор облікового запису й сесію. Залежно від постачальника та вибору користувача це може містити електронну адресу й ім’я. Ми використовуємо ці дані для входу, підтримки облікового запису та синхронізації прогресу між пристроями.</p><h3>Навчальні дані</h3><p>Якщо синхронізацію ввімкнено, застосунок може зберігати прогрес, ідентифікатори відповідей і правильних/неправильних запитань, закладки, помилки, результати діагностики та пробних іспитів, щоденні цілі, вибрані мови, налаштування вигляду та інші навчальні налаштування.</p><h3>Технічні дані сесії</h3><p>Токени сесії зберігаються локально у Keychain пристрою та використовуються для підтримки входу й безпечного зв’язку із Supabase. Токен сесії не використовується для реклами чи відстеження.</p><h3>3. Для чого ми використовуємо інформацію</h3><p>Ми використовуємо інформацію, щоб:</p><ul><li>забезпечувати автентифікацію та доступ до облікового запису;</li><li>синхронізувати прогрес між пристроями;</li><li>показувати каталог, результати тренувань, закладки, помилки та віджети;</li><li>зберігати мовні й візуальні налаштування;</li><li>відповідати на запити підтримки;</li><li>захищати сервіс і з’ясовувати причини невдалих запитів.</li></ul><h3>4. Постачальники послуг</h3><p>Автентифікація та хмарна синхронізація надаються через <strong>Supabase</strong>. Apple і Google можуть обробляти інформацію, якщо користувач обирає відповідний спосіб входу, відповідно до власних політик конфіденційності.</p><p>Застосунок не використовує рекламу, міжзастосункове відстеження, продаж персональної інформації чи SDK аналітики, якщо цю політику не буде оновлено до появи такої функції.</p><h3>5. Зберігання та видалення даних</h3><p>Дані облікового запису зберігаються, доки обліковий запис активний або це потрібно для надання сервісу. Вийти можна будь-коли. Користувачі з обліковим записом можуть запросити видалення через <strong>Налаштування → Обліковий запис → Видалити обліковий запис</strong>. Видалення прибирає обліковий запис, прогрес і пов’язані дані, які обробляє застосунок, з урахуванням технічних резервних копій або законодавчих вимог.</p><p>Дані гостя можна видалити засобами скидання прогресу або видаливши застосунок із пристрою.</p><h3>6. Безпека</h3><p>Для локального зберігання токенів ми використовуємо Keychain платформи, а для хмарної синхронізації — автентифіковані запити. Жоден спосіб передавання чи зберігання не є повністю безпечним, але ми вживаємо розумних заходів, що відповідають сервісу.</p><h3>7. Діти</h3><p>Застосунок є освітнім інструментом і не призначений для збору інформації про дітей. Не створюйте обліковий запис від імені дитини без необхідного дозволу.</p><h3>8. Зміни</h3><p>Ми можемо оновлювати цю політику, коли змінюються застосунок або практики роботи з даними. Оновлена версія публікуватиметься за тією самою URL-адресою з новою датою.</p>`,
tr:`<span class="card-label">Gizlilik</span><h2>Gizlilik Politikası — Leben in Deutschland</h2><p class="policy-date"><strong>Son güncelleme:</strong> 27 Ağustos 2026</p><p>Bu politika, Denys Vasyliuk’un <strong>Leben in Deutschland</strong> uygulamasındaki bilgileri nasıl işlediğini açıklar.</p><h3>1. Uygulamanın amacı</h3><p>Leben in Deutschland, Almanya entegrasyon ve vatandaşlık bilgi testiyle ilgili soruları, açıklamaları, kelimeleri ve ilerlemeyi çalışmak için kullanılan eğitim uygulamasıdır.</p><h3>2. İşlediğimiz bilgiler</h3><h3>Misafir kullanımı</h3><p>Uygulama misafir olarak kullanılabilir. İlerleme, ayarlar, yer imleri ve çalışma geçmişi cihazda yerel olarak saklanabilir. Kullanıcı giriş yapmadıkça misafir verileri bir hesapla senkronize edilmez.</p><h3>Apple veya Google ile giriş</h3><p>Kullanıcı Apple veya Google ile giriş yaptığında kimlik doğrulama sağlayıcısı ve Supabase bir hesap kimliği ve oturum oluşturur. Sağlayıcıya ve kullanıcının seçimlerine bağlı olarak e-posta adresi ve ad işlenebilir. Bu bilgiler giriş, hesabın kullanılabilir tutulması ve ilerlemenin cihazlar arasında senkronizasyonu için kullanılır.</p><h3>Öğrenme verileri</h3><p>Hesap senkronizasyonu etkinleştirildiğinde ilerleme, yanıtlanan/doğru/yanlış soru kimlikleri, yer imleri, hatalar, tanılama ve deneme sınavı sonuçları, günlük hedefler, seçilen diller, görünüm tercihleri ve diğer öğrenme ayarları saklanabilir.</p><h3>Teknik oturum verileri</h3><p>Oturum belirteçleri cihazın Keychain’inde yerel olarak saklanır ve oturumu açık tutmak ve Supabase ile güvenli iletişim kurmak için kullanılır. Oturum belirteci reklam veya takip amacıyla kullanılmaz.</p><h3>3. Bilgileri kullanma amaçlarımız</h3><p>Bilgileri şunlar için kullanırız:</p><ul><li>kimlik doğrulama ve hesap erişimi sağlamak;</li><li>öğrenme ilerlemesini cihazlar arasında senkronize etmek;</li><li>katalogu, çalışma sonuçlarını, yer imlerini, hataları ve widget’ları göstermek;</li><li>dil ve görünüm tercihlerini kaydetmek;</li><li>destek taleplerine yanıt vermek;</li><li>hizmeti korumak ve başarısız istekleri gidermek.</li></ul><h3>4. Hizmet sağlayıcıları</h3><p>Kimlik doğrulama ve bulut senkronizasyonu <strong>Supabase</strong> üzerinden sağlanır. Kullanıcı ilgili giriş yöntemini seçtiğinde Apple ve Google kendi gizlilik politikalarına göre bilgi işleyebilir.</p><p>Bu politika böyle bir özellik eklenmeden önce güncellenmedikçe uygulama reklam, uygulamalar arası takip, kişisel bilgi satışı veya analiz SDK’ları kullanmaz.</p><h3>5. Saklama ve silme</h3><p>Hesap verileri hesap aktif olduğu sürece veya hizmeti sağlamak için gerektiği kadar saklanır. Kullanıcı istediği zaman çıkış yapabilir. Hesap sahibi kullanıcılar <strong>Ayarlar → Hesap → Hesabı sil</strong> bölümünden silme talep edebilir. Silme işlemi, teknik yedekler veya yasal saklama yükümlülükleri saklı kalmak üzere hesabı, ilerlemeyi ve uygulamanın işlediği ilişkili verileri kaldırır.</p><p>Misafir verileri uygulamanın ilerlemeyi sıfırlama kontrolleriyle veya uygulama cihazdan silinerek kaldırılabilir.</p><h3>6. Güvenlik</h3><p>Yerel oturum belirteçleri için platform Keychain’ini, bulut senkronizasyonu için kimliği doğrulanmış istekleri kullanırız. Hiçbir aktarım veya saklama yöntemi tamamen güvenli değildir; ancak hizmete uygun makul önlemleri alırız.</p><h3>7. Çocuklar</h3><p>Uygulama bir eğitim aracıdır ve çocuklardan bilgi toplamaya yönelik değildir. Gerekli izin olmadan çocuk adına hesap oluşturmayın.</p><h3>8. Değişiklikler</h3><p>Uygulama veya veri uygulamalarımız değiştiğinde bu politikayı güncelleyebiliriz. Güncellenmiş sürüm aynı URL’de yeni “Son güncelleme” tarihiyle yayımlanır.</p>`,
ar:`<span class="card-label">الخصوصية</span><h2>سياسة الخصوصية — Leben in Deutschland</h2><p class="policy-date"><strong>آخر تحديث:</strong> ٢٧ أغسطس ٢٠٢٦</p><p>توضح هذه السياسة كيفية تعامل Denys Vasyliuk («نحن») مع المعلومات في تطبيق <strong>Leben in Deutschland</strong>.</p><h3>1. ما يفعله التطبيق</h3><p>تطبيق Leben in Deutschland تعليمي للتدرب على الأسئلة والشرح والمفردات ومتابعة التقدم المرتبط باختبار الاندماج/المواطنة الألماني.</p><h3>2. المعلومات التي نعالجها</h3><h3>استخدام الضيف</h3><p>يمكن استخدام التطبيق كضيف. قد يُخزّن التقدم والإعدادات والإشارات المرجعية وسجل التدريب محليًا على الجهاز. ولا تتم مزامنة بيانات الضيف مع حساب إلا بعد تسجيل الدخول.</p><h3>تسجيل الدخول عبر Apple أو Google</h3><p>عند تسجيل الدخول عبر Apple أو Google، ينشئ مزود المصادقة وSupabase معرّفًا للحساب وجلسة. وقد يشمل ذلك البريد الإلكتروني والاسم وفقًا للمزود واختيارات المستخدم. نستخدم هذه المعلومات للمصادقة وإتاحة الحساب ومزامنة التقدم بين الأجهزة.</p><h3>بيانات التعلم</h3><p>عند تفعيل مزامنة الحساب، قد يخزن التطبيق التقدم ومعرّفات الأسئلة المجاب عنها والصحيحة والخاطئة والإشارات المرجعية والأخطاء ونتائج التشخيص والاختبارات التجريبية والأهداف اليومية واللغات المختارة وتفضيلات المظهر وإعدادات التعلم الأخرى.</p><h3>بيانات الجلسة التقنية</h3><p>تُخزّن رموز الجلسة محليًا في Keychain الجهاز وتُستخدم لإبقاء المستخدم مسجلًا والتواصل بأمان مع Supabase. ولا تُستخدم للت advertising أو التتبع.</p><h3>3. لماذا نستخدم المعلومات</h3><p>نستخدم المعلومات من أجل:</p><ul><li>توفير المصادقة والوصول إلى الحساب؛</li><li>مزامنة التقدم بين الأجهزة؛</li><li>عرض الكتالوج ونتائج التدريب والإشارات المرجعية والأخطاء والأدوات؛</li><li>حفظ تفضيلات اللغة والمظهر؛</li><li>الرد على طلبات الدعم؛</li><li>حماية الخدمة ومعالجة الطلبات الفاشلة.</li></ul><h3>4. مزودو الخدمة</h3><p>تُقدَّم المصادقة والمزامنة السحابية عبر <strong>Supabase</strong>. وقد تعالج Apple وGoogle المعلومات عند اختيار خدمة تسجيل الدخول الخاصة بهما وفقًا لسياساتهما.</p><p>لا يستخدم التطبيق الإعلانات أو التتبع بين التطبيقات أو بيع المعلومات الشخصية أو حزم التحليلات ما لم تُحدّث هذه السياسة قبل تقديم هذه الميزة.</p><h3>5. الاحتفاظ بالبيانات وحذفها</h3><p>تُحتفظ بيانات الحساب ما دام الحساب نشطًا أو حسب الحاجة لتقديم الخدمة. يمكن تسجيل الخروج في أي وقت. ويمكن للمستخدمين المصادق عليهم طلب الحذف من <strong>الإعدادات → الحساب → حذف الحساب</strong>. يؤدي الحذف إلى إزالة الحساب والتقدم والبيانات المرتبطة التي يعالجها التطبيق، مع مراعاة النسخ الاحتياطية التقنية أو المتطلبات القانونية.</p><p>يمكن إزالة بيانات الضيف باستخدام أدوات إعادة ضبط التقدم أو حذف التطبيق من الجهاز.</p><h3>6. الأمان</h3><p>نستخدم Keychain الخاص بالمنصة لتخزين رموز الجلسة محليًا والطلبات المصادق عليها للمزامنة السحابية. لا توجد طريقة نقل أو تخزين آمنة تمامًا، لكننا نتخذ تدابير معقولة مناسبة للخدمة.</p><h3>7. الأطفال</h3><p>التطبيق أداة تعليمية وليس موجّهًا لجمع معلومات من الأطفال. لا تنشئ حسابًا نيابة عن طفل دون الإذن اللازم.</p><h3>8. التغييرات</h3><p>قد نحدّث هذه السياسة عند تغيير التطبيق أو ممارسات البيانات. ستُنشر النسخة المحدثة في العنوان نفسه مع تاريخ جديد لـ«آخر تحديث».</p>`,
pl:`<span class="card-label">Prywatność</span><h2>Polityka prywatności — Leben in Deutschland</h2><p class="policy-date"><strong>Ostatnia aktualizacja:</strong> 27 sierpnia 2026 r.</p><p>Niniejsza polityka wyjaśnia, w jaki sposób Denys Vasyliuk („my”) przetwarza informacje w aplikacji <strong>Leben in Deutschland</strong>.</p><h3>1. Działanie aplikacji</h3><p>Leben in Deutschland to aplikacja edukacyjna do ćwiczenia pytań, wyjaśnień i słownictwa oraz śledzenia postępów związanych z niemieckim testem integracyjnym/obywatelskim.</p><h3>2. Przetwarzane informacje</h3><h3>Korzystanie jako gość</h3><p>Z aplikacji można korzystać jako gość. Postępy, ustawienia, zakładki i historia ćwiczeń mogą być przechowywane lokalnie na urządzeniu. Dane gościa nie są synchronizowane z kontem, dopóki użytkownik się nie zaloguje.</p><h3>Logowanie przez Apple lub Google</h3><p>Po zalogowaniu przez Apple lub Google dostawca uwierzytelniania i Supabase tworzą identyfikator konta oraz sesję. W zależności od dostawcy i wyborów użytkownika może to obejmować adres e-mail i imię. Informacje te służą do uwierzytelniania, utrzymania konta i synchronizacji postępów między urządzeniami.</p><h3>Dane dotyczące nauki</h3><p>Po włączeniu synchronizacji konta aplikacja może przechowywać postępy, identyfikatory pytań z odpowiedziami, zakładki, błędy, wyniki diagnozy i egzaminów próbnych, cele dzienne, wybrane języki, ustawienia wyglądu i inne ustawienia nauki.</p><h3>Techniczne dane sesji</h3><p>Tokeny sesji są przechowywane lokalnie w pęku kluczy urządzenia i służą do utrzymywania logowania oraz bezpiecznej komunikacji z Supabase. Token sesji nie służy do reklam ani śledzenia.</p><h3>3. Dlaczego używamy informacji</h3><p>Wykorzystujemy informacje, aby:</p><ul><li>zapewnić uwierzytelnianie i dostęp do konta;</li><li>synchronizować postępy między urządzeniami;</li><li>wyświetlać katalog, wyniki ćwiczeń, zakładki, błędy i widżety;</li><li>zapisywać preferencje językowe i wyglądu;</li><li>odpowiadać na prośby o pomoc;</li><li>chronić usługę i rozwiązywać problemy z nieudanymi żądaniami.</li></ul><h3>4. Dostawcy usług</h3><p>Uwierzytelnianie i synchronizacja w chmurze są zapewniane przez <strong>Supabase</strong>. Apple i Google mogą przetwarzać informacje po wybraniu ich logowania zgodnie z własnymi politykami prywatności.</p><p>Aplikacja nie używa reklam, śledzenia między aplikacjami, sprzedaży danych osobowych ani SDK analitycznych, chyba że polityka zostanie zaktualizowana przed wprowadzeniem takiej funkcji.</p><h3>5. Przechowywanie i usuwanie danych</h3><p>Dane konta są przechowywane, gdy konto jest aktywne lub gdy jest to potrzebne do świadczenia usługi. Użytkownik może wylogować się w dowolnym momencie. Użytkownicy z kontem mogą poprosić o usunięcie w sekcji <strong>Ustawienia → Konto → Usuń konto</strong>. Usunięcie obejmuje konto, postępy i powiązane dane obsługiwane przez aplikację, z uwzględnieniem kopii technicznych lub wymogów prawnych.</p><p>Dane gościa można usunąć za pomocą opcji resetowania postępów albo przez usunięcie aplikacji z urządzenia.</p><h3>6. Bezpieczeństwo</h3><p>Do lokalnego przechowywania tokenów używamy pęku kluczy platformy, a do synchronizacji — uwierzytelnionych żądań. Żaden sposób przesyłania ani przechowywania nie jest całkowicie bezpieczny, ale stosujemy rozsądne środki odpowiednie dla usługi.</p><h3>7. Dzieci</h3><p>Aplikacja jest narzędziem edukacyjnym i nie jest przeznaczona do zbierania informacji od dzieci. Nie twórz konta w imieniu dziecka bez wymaganej zgody.</p><h3>8. Zmiany</h3><p>Możemy aktualizować tę politykę, gdy zmieni się aplikacja lub sposób przetwarzania danych. Zaktualizowana wersja zostanie opublikowana pod tym samym adresem z nową datą.</p>`,
ro:`<span class="card-label">Confidențialitate</span><h2>Politica de confidențialitate — Leben in Deutschland</h2><p class="policy-date"><strong>Ultima actualizare:</strong> 27 august 2026</p><p>Această politică explică modul în care Denys Vasyliuk („noi”) prelucrează informațiile în aplicația <strong>Leben in Deutschland</strong>.</p><h3>1. Ce face aplicația</h3><p>Leben in Deutschland este o aplicație educațională pentru exersarea întrebărilor, explicațiilor și vocabularului și pentru urmărirea progresului legat de testul german de integrare/cetățenie.</p><h3>2. Informațiile prelucrate</h3><h3>Utilizarea ca invitat</h3><p>Aplicația poate fi folosită ca invitat. Progresul, setările, marcajele și istoricul exercițiilor pot fi stocate local pe dispozitiv. Datele invitatului nu sunt sincronizate cu un cont decât dacă utilizatorul se autentifică.</p><h3>Autentificarea prin Apple sau Google</h3><p>Dacă utilizatorul se autentifică prin Apple sau Google, furnizorul de autentificare și Supabase creează un identificator de cont și o sesiune. În funcție de furnizor și de alegerile utilizatorului, acestea pot include adresa de e-mail și numele. Folosim informațiile pentru autentificare, păstrarea contului și sincronizarea progresului între dispozitive.</p><h3>Date de învățare</h3><p>Când sincronizarea contului este activată, aplicația poate stoca progresul, identificatorii întrebărilor cu răspunsuri, marcajele, greșelile, rezultatele diagnosticului și ale examenelor simulate, obiectivele zilnice, limbile selectate, preferințele de aspect și alte setări de învățare.</p><h3>Date tehnice ale sesiunii</h3><p>Tokenurile sesiunii sunt stocate local în Keychain-ul dispozitivului și sunt folosite pentru menținerea autentificării și comunicarea sigură cu Supabase. Tokenul sesiunii nu este folosit pentru publicitate sau urmărire.</p><h3>3. De ce folosim informațiile</h3><p>Folosim informațiile pentru:</p><ul><li>a oferi autentificare și acces la cont;</li><li>a sincroniza progresul între dispozitive;</li><li>a afișa catalogul, rezultatele, marcajele, greșelile și widgeturile;</li><li>a salva preferințele de limbă și aspect;</li><li>a răspunde solicitărilor de asistență;</li><li>a proteja serviciul și a remedia cererile eșuate.</li></ul><h3>4. Furnizori de servicii</h3><p>Autentificarea și sincronizarea în cloud sunt furnizate prin <strong>Supabase</strong>. Apple și Google pot prelucra informații atunci când utilizatorul alege autentificarea lor, conform propriilor politici de confidențialitate.</p><p>Aplicația nu folosește publicitate, urmărire între aplicații, vânzarea informațiilor personale sau SDK-uri de analiză, cu excepția cazului în care politica este actualizată înaintea introducerii unei astfel de funcții.</p><h3>5. Păstrarea și ștergerea datelor</h3><p>Datele contului sunt păstrate cât timp contul este activ sau cât este necesar pentru furnizarea serviciului. Utilizatorul se poate deconecta oricând. Utilizatorii autentificați pot solicita ștergerea din <strong>Setări → Cont → Șterge contul</strong>. Ștergerea elimină contul, progresul și datele asociate gestionate de aplicație, cu excepția copiilor tehnice sau a obligațiilor legale de păstrare.</p><p>Datele de invitat pot fi șterse folosind opțiunile de resetare a progresului sau prin ștergerea aplicației de pe dispozitiv.</p><h3>6. Securitate</h3><p>Folosim Keychain-ul platformei pentru tokenurile locale și cereri autentificate pentru sincronizarea cloud. Nicio metodă de transmitere sau stocare nu este complet sigură, dar luăm măsuri rezonabile potrivite serviciului.</p><h3>7. Copii</h3><p>Aplicația este un instrument educațional și nu este destinată colectării de informații de la copii. Nu creați un cont în numele unui copil fără permisiunea necesară.</p><h3>8. Modificări</h3><p>Putem actualiza această politică atunci când se schimbă aplicația sau practicile privind datele. Versiunea actualizată va fi publicată la aceeași adresă, cu o nouă dată.</p>`,
it:`<span class="card-label">Privacy</span><h2>Informativa sulla privacy — Leben in Deutschland</h2><p class="policy-date"><strong>Ultimo aggiornamento:</strong> 27 agosto 2026</p><p>Questa informativa spiega come Denys Vasyliuk (“noi”) tratta le informazioni nell’app <strong>Leben in Deutschland</strong>.</p><h3>1. Cosa fa l’app</h3><p>Leben in Deutschland è un’app educativa per esercitare domande, spiegazioni e vocaboli e seguire i progressi relativi al test tedesco di integrazione/cittadinanza.</p><h3>2. Informazioni trattate</h3><h3>Uso come ospite</h3><p>L’app può essere usata come ospite. Progressi, impostazioni, segnalibri e cronologia degli esercizi possono essere salvati localmente sul dispositivo. I dati dell’ospite non vengono sincronizzati con un account finché l’utente non effettua l’accesso.</p><h3>Accesso con Apple o Google</h3><p>Quando l’utente accede con Apple o Google, il provider di autenticazione e Supabase creano un identificativo dell’account e una sessione. A seconda del provider e delle scelte dell’utente, possono essere inclusi e-mail e nome. Usiamo queste informazioni per autenticare l’utente, mantenere disponibile l’account e sincronizzare i progressi tra i dispositivi.</p><h3>Dati di apprendimento</h3><p>Con la sincronizzazione dell’account attiva, l’app può memorizzare progressi, identificativi delle domande con risposta/corrette/errate, segnalibri, errori, risultati diagnostici e di simulazione d’esame, obiettivi giornalieri, lingue selezionate, preferenze di aspetto e altre impostazioni.</p><h3>Dati tecnici della sessione</h3><p>I token di sessione sono memorizzati localmente nel Keychain del dispositivo e servono a mantenere l’accesso e comunicare in modo sicuro con Supabase. Il token non viene usato per pubblicità o tracciamento.</p><h3>3. Perché usiamo le informazioni</h3><p>Usiamo le informazioni per:</p><ul><li>fornire autenticazione e accesso all’account;</li><li>sincronizzare i progressi tra dispositivi;</li><li>mostrare catalogo, risultati, segnalibri, errori e widget;</li><li>salvare preferenze di lingua e aspetto;</li><li>rispondere alle richieste di assistenza;</li><li>proteggere il servizio e risolvere richieste non riuscite.</li></ul><h3>4. Fornitori di servizi</h3><p>Autenticazione e sincronizzazione cloud sono fornite tramite <strong>Supabase</strong>. Apple e Google possono trattare informazioni quando l’utente sceglie il relativo accesso, secondo le proprie informative.</p><p>L’app non usa pubblicità, tracciamento tra app, vendita di informazioni personali o SDK di analisi, salvo aggiornamento della presente informativa prima dell’introduzione di tali funzioni.</p><h3>5. Conservazione e cancellazione</h3><p>I dati dell’account vengono conservati finché l’account è attivo o quanto necessario per fornire il servizio. L’utente può uscire in qualsiasi momento. Gli utenti autenticati possono richiedere la cancellazione da <strong>Impostazioni → Account → Elimina account</strong>. La cancellazione rimuove account, progressi e dati associati gestiti dall’app, fatti salvi backup tecnici o obblighi legali.</p><p>I dati dell’ospite possono essere rimossi usando i controlli di reimpostazione o eliminando l’app dal dispositivo.</p><h3>6. Sicurezza</h3><p>Usiamo il Keychain della piattaforma per i token locali e richieste autenticate per la sincronizzazione cloud. Nessun metodo di trasmissione o archiviazione è completamente sicuro, ma adottiamo misure ragionevoli adeguate al servizio.</p><h3>7. Minori</h3><p>L’app è uno strumento educativo e non è destinata a raccogliere informazioni sui minori. Non creare un account per conto di un minore senza il necessario consenso.</p><h3>8. Modifiche</h3><p>Possiamo aggiornare questa informativa quando cambiano l’app o le pratiche sui dati. La versione aggiornata sarà pubblicata allo stesso URL con una nuova data.</p>`,
es:`<span class="card-label">Privacidad</span><h2>Política de privacidad — Leben in Deutschland</h2><p class="policy-date"><strong>Última actualización:</strong> 27 de agosto de 2026</p><p>Esta política explica cómo Denys Vasyliuk («nosotros») trata la información en la aplicación <strong>Leben in Deutschland</strong>.</p><h3>1. Qué hace la aplicación</h3><p>Leben in Deutschland es una aplicación educativa para practicar preguntas, explicaciones y vocabulario, y seguir el progreso relacionado con el examen alemán de integración/ciudadanía.</p><h3>2. Información que tratamos</h3><h3>Uso como invitado</h3><p>La aplicación puede utilizarse como invitado. El progreso, los ajustes, los marcadores y el historial de práctica pueden almacenarse localmente en el dispositivo. Los datos de invitado no se sincronizan con una cuenta hasta que el usuario inicia sesión.</p><h3>Inicio de sesión con Apple o Google</h3><p>Si el usuario inicia sesión con Apple o Google, el proveedor de autenticación y Supabase crean un identificador de cuenta y una sesión. Según el proveedor y las elecciones del usuario, esto puede incluir correo electrónico y nombre. Usamos esta información para autenticar, mantener la cuenta disponible y sincronizar el progreso entre dispositivos.</p><h3>Datos de aprendizaje</h3><p>Cuando se activa la sincronización de la cuenta, la aplicación puede almacenar progreso, identificadores de preguntas respondidas/correctas/incorrectas, marcadores, errores, resultados de diagnóstico y simulacros, objetivos diarios, idiomas seleccionados, preferencias de apariencia y otros ajustes de aprendizaje.</p><h3>Datos técnicos de sesión</h3><p>Los tokens de sesión se almacenan localmente en el Keychain del dispositivo y se utilizan para mantener la sesión iniciada y comunicarse de forma segura con Supabase. No se usan para publicidad ni seguimiento.</p><h3>3. Para qué usamos la información</h3><p>Usamos la información para:</p><ul><li>proporcionar autenticación y acceso a la cuenta;</li><li>sincronizar el progreso entre dispositivos;</li><li>mostrar el catálogo, resultados, marcadores, errores y widgets;</li><li>guardar preferencias de idioma y apariencia;</li><li>responder a solicitudes de soporte;</li><li>proteger el servicio y solucionar solicitudes fallidas.</li></ul><h3>4. Proveedores de servicios</h3><p>La autenticación y la sincronización en la nube se proporcionan mediante <strong>Supabase</strong>. Apple y Google pueden tratar información cuando el usuario elige su inicio de sesión, según sus propias políticas.</p><p>La aplicación no utiliza publicidad, seguimiento entre aplicaciones, venta de información personal ni SDK de análisis, salvo que esta política se actualice antes de introducir una función de ese tipo.</p><h3>5. Conservación y eliminación</h3><p>Los datos de la cuenta se conservan mientras la cuenta esté activa o sea necesario para prestar el servicio. El usuario puede cerrar sesión en cualquier momento. Los usuarios autenticados pueden solicitar la eliminación desde <strong>Ajustes → Cuenta → Eliminar cuenta</strong>. La eliminación borra la cuenta, el progreso y los datos asociados gestionados por la aplicación, sin perjuicio de copias técnicas o requisitos legales.</p><p>Los datos de invitado pueden eliminarse con los controles de restablecimiento o borrando la aplicación del dispositivo.</p><h3>6. Seguridad</h3><p>Usamos el Keychain de la plataforma para los tokens locales y solicitudes autenticadas para la sincronización en la nube. Ningún método de transmisión o almacenamiento es completamente seguro, pero aplicamos medidas razonables adecuadas al servicio.</p><h3>7. Menores</h3><p>La aplicación es una herramienta educativa y no está dirigida a recopilar información de menores. No cree una cuenta en nombre de un menor sin el permiso necesario.</p><h3>8. Cambios</h3><p>Podemos actualizar esta política cuando cambien la aplicación o sus prácticas de datos. La versión actualizada se publicará en la misma URL con una nueva fecha.</p>`,
fr:`<span class="card-label">Confidentialité</span><h2>Politique de confidentialité — Leben in Deutschland</h2><p class="policy-date"><strong>Dernière mise à jour :</strong> 27 août 2026</p><p>Cette politique explique comment Denys Vasyliuk (« nous ») traite les informations dans l’application <strong>Leben in Deutschland</strong>.</p><h3>1. Fonctionnement de l’application</h3><p>Leben in Deutschland est une application éducative permettant de s’exercer avec des questions, des explications et du vocabulaire, et de suivre ses progrès liés au test allemand d’intégration/citoyenneté.</p><h3>2. Informations traitées</h3><h3>Utilisation en tant qu’invité</h3><p>L’application peut être utilisée en tant qu’invité. Les progrès, réglages, favoris et historique d’exercices peuvent être stockés localement sur l’appareil. Les données d’invité ne sont pas synchronisées avec un compte tant que l’utilisateur ne se connecte pas.</p><h3>Connexion avec Apple ou Google</h3><p>Lorsqu’un utilisateur se connecte avec Apple ou Google, le fournisseur d’authentification et Supabase créent un identifiant de compte et une session. Selon le fournisseur et les choix de l’utilisateur, cela peut inclure une adresse e-mail et un nom. Nous utilisons ces informations pour authentifier l’utilisateur, maintenir le compte disponible et synchroniser les progrès entre ses appareils.</p><h3>Données d’apprentissage</h3><p>Lorsque la synchronisation du compte est activée, l’application peut stocker les progrès, les identifiants des questions répondues/correctes/incorrectes, les favoris, les erreurs, les résultats de diagnostic et d’examens blancs, les objectifs quotidiens, les langues sélectionnées, les préférences d’apparence et d’autres réglages.</p><h3>Données techniques de session</h3><p>Les jetons de session sont stockés localement dans le trousseau de l’appareil et servent à maintenir la connexion et à communiquer de manière sécurisée avec Supabase. Ils ne sont pas utilisés à des fins publicitaires ou de suivi.</p><h3>3. Utilisation des informations</h3><p>Nous utilisons les informations pour :</p><ul><li>fournir l’authentification et l’accès au compte ;</li><li>synchroniser les progrès entre appareils ;</li><li>afficher le catalogue, les résultats, les favoris, les erreurs et les widgets ;</li><li>enregistrer les préférences de langue et d’apparence ;</li><li>répondre aux demandes d’assistance ;</li><li>protéger le service et résoudre les requêtes échouées.</li></ul><h3>4. Fournisseurs de services</h3><p>L’authentification et la synchronisation cloud sont fournies par <strong>Supabase</strong>. Apple et Google peuvent traiter des informations lorsque l’utilisateur choisit leur service de connexion, conformément à leurs propres politiques.</p><p>L’application n’utilise pas de publicité, de suivi inter-applications, de vente d’informations personnelles ni de SDK d’analyse, sauf si cette politique est mise à jour avant l’introduction d’une telle fonction.</p><h3>5. Conservation et suppression</h3><p>Les données du compte sont conservées tant que le compte est actif ou aussi longtemps que nécessaire pour fournir le service. L’utilisateur peut se déconnecter à tout moment. Les utilisateurs authentifiés peuvent demander la suppression via <strong>Réglages → Compte → Supprimer le compte</strong>. La suppression retire le compte, les progrès et les données associées gérées par l’application, sous réserve des sauvegardes techniques ou obligations légales.</p><p>Les données d’invité peuvent être supprimées avec les commandes de réinitialisation ou en supprimant l’application de l’appareil.</p><h3>6. Sécurité</h3><p>Nous utilisons le trousseau de la plateforme pour les jetons locaux et des requêtes authentifiées pour la synchronisation cloud. Aucune méthode de transmission ou de stockage n’est totalement sûre, mais nous prenons des mesures raisonnables adaptées au service.</p><h3>7. Enfants</h3><p>L’application est un outil éducatif et n’est pas destinée à recueillir des informations sur les enfants. Ne créez pas de compte au nom d’un enfant sans l’autorisation nécessaire.</p><h3>8. Modifications</h3><p>Nous pouvons mettre à jour cette politique lorsque l’application ou ses pratiques de données changent. La version mise à jour sera publiée à la même URL avec une nouvelle date.</p>`,
bg:`<span class="card-label">Поверителност</span><h2>Политика за поверителност — Leben in Deutschland</h2><p class="policy-date"><strong>Последна актуализация:</strong> 27 август 2026 г.</p><p>Тази политика обяснява как Denys Vasyliuk („ние“) обработва информацията в приложението <strong>Leben in Deutschland</strong>.</p><h3>1. Какво прави приложението</h3><p>Leben in Deutschland е образователно приложение за упражняване на въпроси, обяснения и речник и за проследяване на напредъка, свързан с германския тест за интеграция/гражданство.</p><h3>2. Обработвана информация</h3><h3>Използване като гост</h3><p>Приложението може да се използва като гост. Напредъкът, настройките, отметките и историята на упражненията могат да се съхраняват локално на устройството. Данните на госта не се синхронизират с акаунт, освен ако потребителят не влезе.</p><h3>Вход с Apple или Google</h3><p>При вход с Apple или Google доставчикът на удостоверяване и Supabase създават идентификатор на акаунт и сесия. В зависимост от доставчика и избора на потребителя това може да включва имейл и име. Използваме информацията за удостоверяване, поддържане на акаунта и синхронизиране на напредъка между устройствата.</p><h3>Данни за обучението</h3><p>При включена синхронизация приложението може да съхранява напредък, идентификатори на отговорени/верни/грешни въпроси, отметки, грешки, резултати от диагностика и пробни изпити, дневни цели, избрани езици, настройки на изгледа и други учебни настройки.</p><h3>Технически данни за сесията</h3><p>Токените на сесията се съхраняват локално в Keychain на устройството и се използват за поддържане на входа и сигурна комуникация със Supabase. Токенът не се използва за реклама или проследяване.</p><h3>3. Защо използваме информацията</h3><p>Използваме информацията, за да:</p><ul><li>осигурим удостоверяване и достъп до акаунта;</li><li>синхронизираме напредъка между устройствата;</li><li>показваме каталога, резултатите, отметките, грешките и уиджетите;</li><li>запазваме езиковите и визуалните настройки;</li><li>отговаряме на запитвания за поддръжка;</li><li>защитаваме услугата и отстраняваме неуспешни заявки.</li></ul><h3>4. Доставчици на услуги</h3><p>Удостоверяването и облачната синхронизация се предоставят чрез <strong>Supabase</strong>. Apple и Google могат да обработват информация при избран от потребителя вход съгласно собствените си политики.</p><p>Приложението не използва реклами, проследяване между приложения, продажба на лична информация или аналитични SDK, освен ако политиката не бъде актуализирана преди въвеждането на такава функция.</p><h3>5. Съхранение и изтриване</h3><p>Данните на акаунта се пазят, докато акаунтът е активен или доколкото е необходимо за услугата. Потребителят може да излезе по всяко време. Удостоверените потребители могат да поискат изтриване от <strong>Настройки → Акаунт → Изтриване на акаунта</strong>. Изтриването премахва акаунта, напредъка и свързаните данни, обработвани от приложението, с изключение на технически резервни копия или законови изисквания.</p><p>Данните на госта могат да бъдат премахнати чрез нулиране на напредъка или чрез изтриване на приложението.</p><h3>6. Сигурност</h3><p>Използваме Keychain на платформата за локалните токени и удостоверени заявки за облачната синхронизация. Никой метод не е напълно сигурен, но прилагаме разумни мерки, подходящи за услугата.</p><h3>7. Деца</h3><p>Приложението е образователен инструмент и не е насочено към събиране на информация от деца. Не създавайте акаунт от името на дете без необходимото разрешение.</p><h3>8. Промени</h3><p>Можем да актуализираме тази политика при промени в приложението или практиките за данни. Обновената версия ще бъде публикувана на същия URL с нова дата.</p>`,
hr:`<span class="card-label">Privatnost</span><h2>Pravila privatnosti — Leben in Deutschland</h2><p class="policy-date"><strong>Zadnje ažuriranje:</strong> 27. kolovoza 2026.</p><p>Ova pravila objašnjavaju kako Denys Vasyliuk („mi“) obrađuje podatke u aplikaciji <strong>Leben in Deutschland</strong>.</p><h3>1. Što aplikacija radi</h3><p>Leben in Deutschland obrazovna je aplikacija za vježbanje pitanja, objašnjenja i rječnika te praćenje napretka povezanog s njemačkim integracijskim/testom za državljanstvo.</p><h3>2. Podaci koje obrađujemo</h3><h3>Korištenje kao gost</h3><p>Aplikacija se može koristiti kao gost. Napredak, postavke, oznake i povijest vježbanja mogu se čuvati lokalno na uređaju. Podaci gosta ne sinkroniziraju se s računom dok se korisnik ne prijavi.</p><h3>Prijava putem Applea ili Googlea</h3><p>Kada se korisnik prijavi putem Applea ili Googlea, pružatelj autentifikacije i Supabase stvaraju identifikator računa i sesiju. Ovisno o pružatelju i izboru korisnika, to može uključivati e-poštu i ime. Podaci se koriste za autentifikaciju, dostupnost računa i sinkronizaciju napretka između uređaja.</p><h3>Podaci o učenju</h3><p>Kada je sinkronizacija uključena, aplikacija može pohraniti napredak, identifikatore odgovorenih/točnih/netočnih pitanja, oznake, pogreške, rezultate dijagnostike i probnih ispita, dnevne ciljeve, odabrane jezike, postavke izgleda i druge postavke učenja.</p><h3>Tehnički podaci sesije</h3><p>Tokeni sesije pohranjuju se lokalno u Keychain uređaja i koriste za održavanje prijave i sigurnu komunikaciju sa Supabaseom. Token se ne koristi za oglašavanje ili praćenje.</p><h3>3. Zašto koristimo podatke</h3><p>Podatke koristimo za:</p><ul><li>autentifikaciju i pristup računu;</li><li>sinkronizaciju napretka između uređaja;</li><li>prikaz kataloga, rezultata, oznaka, pogrešaka i widgeta;</li><li>spremanje jezičnih i vizualnih postavki;</li><li>odgovaranje na zahtjeve podrške;</li><li>zaštitu usluge i rješavanje neuspjelih zahtjeva.</li></ul><h3>4. Pružatelji usluga</h3><p>Autentifikaciju i sinkronizaciju u oblaku pruža <strong>Supabase</strong>. Apple i Google mogu obrađivati podatke kada korisnik odabere njihovu prijavu, prema vlastitim pravilima privatnosti.</p><p>Aplikacija ne koristi oglašavanje, praćenje između aplikacija, prodaju osobnih podataka ni analitičke SDK-ove, osim ako se pravila ažuriraju prije uvođenja takve funkcije.</p><h3>5. Čuvanje i brisanje</h3><p>Podaci računa čuvaju se dok je račun aktivan ili koliko je potrebno za uslugu. Korisnik se može odjaviti u bilo kojem trenutku. Prijavljeni korisnici mogu zatražiti brisanje putem <strong>Postavke → Račun → Izbriši račun</strong>. Brisanjem se uklanjaju račun, napredak i povezani podaci koje aplikacija obrađuje, uz moguće tehničke sigurnosne kopije ili zakonske obveze.</p><p>Podaci gosta mogu se ukloniti resetiranjem napretka ili brisanjem aplikacije.</p><h3>6. Sigurnost</h3><p>Za lokalne tokene koristimo Keychain platforme, a za sinkronizaciju autentificirane zahtjeve. Nijedan način prijenosa ili pohrane nije potpuno siguran, ali primjenjujemo razumne mjere primjerene usluzi.</p><h3>7. Djeca</h3><p>Aplikacija je obrazovni alat i nije namijenjena prikupljanju podataka o djeci. Ne stvarajte račun u ime djeteta bez potrebnog dopuštenja.</p><h3>8. Promjene</h3><p>Ova pravila možemo ažurirati kada se promijene aplikacija ili obrada podataka. Ažurirana verzija bit će objavljena na istoj URL adresi s novim datumom.</p>`,
sr:`<span class="card-label">Приватност</span><h2>Политика приватности — Leben in Deutschland</h2><p class="policy-date"><strong>Последње ажурирање:</strong> 27. август 2026.</p><p>Ова политика објашњава како Denys Vasyliuk („ми“) обрађује информације у апликацији <strong>Leben in Deutschland</strong>.</p><h3>1. Шта апликација ради</h3><p>Leben in Deutschland је образовна апликација за вежбање питања, објашњења и речника и праћење напретка у вези са немачким интеграционим/држављанским тестом.</p><h3>2. Информације које обрађујемо</h3><h3>Коришћење као гост</h3><p>Апликација се може користити као гост. Напредак, подешавања, обележивачи и историја вежбања могу се чувати локално на уређају. Подаци госта се не синхронизују са налогом док се корисник не пријави.</p><h3>Пријава преко Apple-а или Google-а</h3><p>При пријави преко Apple-а или Google-а, провајдер за аутентификацију и Supabase креирају идентификатор налога и сесију. У зависности од провајдера и избора корисника, то може укључивати имејл и име. Информације користимо за пријаву, доступност налога и синхронизацију напретка између уређаја.</p><h3>Подаци о учењу</h3><p>Када је синхронизација налога укључена, апликација може чувати напредак, идентификаторе одговорених/тачних/нетачних питања, обележиваче, грешке, резултате дијагностике и пробних испита, дневне циљеве, изабране језике, подешавања изгледа и друга подешавања учења.</p><h3>Технички подаци сесије</h3><p>Токени сесије се чувају локално у Keychain-у уређаја и користе се за одржавање пријаве и безбедну комуникацију са Supabase-ом. Токен се не користи за оглашавање или праћење.</p><h3>3. Зашто користимо информације</h3><p>Информације користимо да:</p><ul><li>обезбедимо аутентификацију и приступ налогу;</li><li>синхронизујемо напредак између уређаја;</li><li>прикажемо каталог, резултате, обележиваче, грешке и виџете;</li><li>сачувамо језичка и визуелна подешавања;</li><li>одговоримо на захтеве за подршку;</li><li>заштитимо услугу и решимо неуспеле захтеве.</li></ul><h3>4. Пружаоци услуга</h3><p>Аутентификацију и синхронизацију у облаку пружа <strong>Supabase</strong>. Apple и Google могу обрађивати информације када корисник изабере њихову пријаву, у складу са сопственим политикама.</p><p>Апликација не користи оглашавање, праћење између апликација, продају личних података ни аналитичке SDK-ове, осим ако се политика ажурира пре увођења такве функције.</p><h3>5. Чување и брисање</h3><p>Подаци налога се чувају док је налог активан или колико је потребно за пружање услуге. Корисник може да се одјави у било ком тренутку. Пријављени корисници могу затражити брисање преко <strong>Подешавања → Налог → Обриши налог</strong>. Брисање уклања налог, напредак и повезане податке које апликација обрађује, уз техничке резервне копије или законске обавезе.</p><p>Подаци госта могу се уклонити ресетовањем напретка или брисањем апликације.</p><h3>6. Безбедност</h3><p>За локалне токене користимо Keychain платформе, а за синхронизацију аутентификоване захтеве. Ниједан начин преноса или чувања није потпуно безбедан, али примењујемо разумне мере примерене услузи.</p><h3>7. Деца</h3><p>Апликација је образовни алат и није намењена прикупљању информација о деци. Не правите налог у име детета без потребне дозволе.</p><h3>8. Измене</h3><p>Ову политику можемо ажурирати када се промене апликација или праксе са подацима. Ажурирана верзија биће објављена на истој URL адреси са новим датумом.</p>`,
fa:`<span class="card-label">حریم خصوصی</span><h2>سیاست حفظ حریم خصوصی — Leben in Deutschland</h2><p class="policy-date"><strong>آخرین به‌روزرسانی:</strong> ۲۷ اوت ۲۰۲۶</p><p>این سیاست توضیح می‌دهد که Denys Vasyliuk («ما») چگونه اطلاعات را در برنامه <strong>Leben in Deutschland</strong> پردازش می‌کند.</p><h3>۱. برنامه چه کاری انجام می‌دهد</h3><p>Leben in Deutschland یک برنامه آموزشی برای تمرین پرسش‌ها، توضیحات و واژگان و پیگیری پیشرفت مرتبط با آزمون ادغام/شهروندی آلمان است.</p><h3>۲. اطلاعاتی که پردازش می‌کنیم</h3><h3>استفاده مهمان</h3><p>برنامه را می‌توان به‌صورت مهمان استفاده کرد. پیشرفت، تنظیمات، نشانک‌ها و تاریخچه تمرین ممکن است به‌صورت محلی روی دستگاه ذخیره شوند. داده‌های مهمان تا زمانی که کاربر وارد حساب نشود با حسابی همگام نمی‌شوند.</p><h3>ورود با Apple یا Google</h3><p>اگر کاربر با Apple یا Google وارد شود، ارائه‌دهنده احراز هویت و Supabase شناسه حساب و نشست ایجاد می‌کنند. بسته به ارائه‌دهنده و انتخاب کاربر، این اطلاعات ممکن است شامل ایمیل و نام باشد. از این اطلاعات برای احراز هویت، در دسترس نگه‌داشتن حساب و همگام‌سازی پیشرفت بین دستگاه‌ها استفاده می‌کنیم.</p><h3>داده‌های یادگیری</h3><p>با فعال بودن همگام‌سازی حساب، برنامه ممکن است پیشرفت، شناسه پرسش‌های پاسخ‌داده‌شده/درست/غلط، نشانک‌ها، اشتباهات، نتایج تشخیصی و آزمون‌های آزمایشی، هدف‌های روزانه، زبان‌های انتخاب‌شده، تنظیمات ظاهر و دیگر تنظیمات یادگیری را ذخیره کند.</p><h3>داده‌های فنی نشست</h3><p>توکن‌های نشست به‌صورت محلی در Keychain دستگاه ذخیره می‌شوند و برای حفظ ورود کاربر و ارتباط امن با Supabase استفاده می‌شوند. توکن نشست برای تبلیغات یا ردیابی استفاده نمی‌شود.</p><h3>۳. چرا از اطلاعات استفاده می‌کنیم</h3><p>از اطلاعات برای موارد زیر استفاده می‌کنیم:</p><ul><li>ارائه احراز هویت و دسترسی به حساب؛</li><li>همگام‌سازی پیشرفت بین دستگاه‌ها؛</li><li>نمایش فهرست، نتایج تمرین، نشانک‌ها، اشتباهات و ویجت‌ها؛</li><li>ذخیره ترجیحات زبان و ظاهر؛</li><li>پاسخ به درخواست‌های پشتیبانی؛</li><li>حفاظت از سرویس و رفع درخواست‌های ناموفق.</li></ul><h3>۴. ارائه‌دهندگان خدمات</h3><p>احراز هویت و همگام‌سازی ابری از طریق <strong>Supabase</strong> ارائه می‌شود. Apple و Google هنگام انتخاب روش ورود خود، طبق سیاست‌های حریم خصوصی خود ممکن است اطلاعات را پردازش کنند.</p><p>برنامه از تبلیغات، ردیابی بین برنامه‌ها، فروش اطلاعات شخصی یا SDKهای تحلیل استفاده نمی‌کند، مگر اینکه پیش از معرفی چنین قابلیتی این سیاست به‌روزرسانی شود.</p><h3>۵. نگهداری و حذف داده‌ها</h3><p>داده‌های حساب تا زمانی که حساب فعال است یا برای ارائه سرویس لازم است نگهداری می‌شوند. کاربر هر زمان می‌تواند خارج شود. کاربران واردشده می‌توانند از مسیر <strong>تنظیمات → حساب → حذف حساب</strong> درخواست حذف کنند. حذف، حساب، پیشرفت و داده‌های مرتبط پردازش‌شده توسط برنامه را حذف می‌کند، با توجه به نسخه‌های پشتیبان فنی یا الزامات قانونی.</p><p>داده‌های مهمان با کنترل‌های بازنشانی پیشرفت یا حذف برنامه از دستگاه قابل حذف هستند.</p><h3>۶. امنیت</h3><p>برای ذخیره محلی توکن نشست از Keychain پلتفرم و برای همگام‌سازی ابری از درخواست‌های احراز‌شده استفاده می‌کنیم. هیچ روش انتقال یا ذخیره‌سازی کاملاً امن نیست، اما اقدامات معقول متناسب با سرویس انجام می‌دهیم.</p><h3>۷. کودکان</h3><p>این برنامه یک ابزار آموزشی است و برای جمع‌آوری اطلاعات از کودکان طراحی نشده است. بدون اجازه لازم از طرف کودک حساب ایجاد نکنید.</p><h3>۸. تغییرات</h3><p>اگر برنامه یا شیوه‌های داده تغییر کند، ممکن است این سیاست را به‌روزرسانی کنیم. نسخه به‌روزشده با تاریخ جدید در همان نشانی منتشر خواهد شد.</p>`,
 ku:`<span class="card-label">Nepenî</span><h2>Polîtîkaya nepenîtiyê — Leben in Deutschland</h2><p class="policy-date"><strong>Nûkirina dawî:</strong> 27 Tebax 2026</p><p>Ev polîtîka rave dike ka Denys Vasyliuk («em») agahiyan di sepana <strong>Leben in Deutschland</strong> de çawa dixe kar.</p><h3>1. Sepan çi dike</h3><p>Leben in Deutschland sepaneke perwerdehiyê ye ji bo pratîka pirsan, ravekirinan û ferhengê û şopandina pêşketinê ya testa entegrasyon/hemwelatîbûna Almanî.</p><h3>2. Agahiyên ku em dixebitin</h3><h3>Bikaranîna mêvan</h3><p>Sepan dikare wekî mêvan were bikaranîn. Pêşketin, mîheng, nîşanker û dîroka pratîkê dikarin li ser amûrê bi awayekî herêmî werin parastin. Daneyên mêvanê bi hesabekî re nayên hevdemkirin heya ku bikarhêner nekeve hundir.</p><h3>Têketin bi Apple an Google</h3><p>Ger bikarhêner bi Apple an Google bikeve hundir, dabînkerê rastkirinê û Supabase nasnameya hesabê û danişînekê çêdikin. Li gorî dabînker û hilbijartina bikarhêner, ev dikare e-name û navê dihewîne. Em van agahiyan ji bo rastkirinê, parastina hesabê û hevdemkirina pêşketinê di navbera amûran de bikar tînin.</p><h3>Daneyên fêrbûnê</h3><p>Dema hevdemkirina hesabê çalak be, sepan dikare pêşketin, nasnameyên pirsên bersivdayî/raste/şaş, nîşanker, şaşî, encamên teşxîs û îmtîhanên pratîkê, armancên rojane, zimanên hilbijartî, mîhengên dîtinê û mîhengên din biparêze.</p><h3>Daneyên teknîkî yên danişînê</h3><p>Tokenên danişînê li ser Keychain-a amûrê têne parastin û ji bo domandina têketinê û ragihandina ewle bi Supabase re tên bikaranîn. Token ji bo reklaman an şopandinê nayê bikaranîn.</p><h3>3. Em çima agahiyan bikar tînin</h3><p>Em agahiyan ji bo van armancan bikar tînin:</p><ul><li>pêşkêşkirina rastkirin û gihîştina hesabê;</li><li>hevdemkirina pêşketinê di navbera amûran de;</li><li>nîşandana katalog, encam, nîşanker, şaşî û widgetan;</li><li>parastina mîhengên ziman û dîtinê;</li><li>bersivdana daxwazên piştgiriyê;</li><li>parastina servisê û çareserkirina daxwazên têkçûyî.</li></ul><h3>4. Dabînkerên servisê</h3><p>Rastkirin û hevdemkirina cloudê bi <strong>Supabase</strong> têne pêşkêşkirin. Apple û Google dikarin li gorî polîtîkayên xwe agahiyan bixebitin dema bikarhêner rêya têketina wan hilbijêre.</p><p>Sepan reklama, şopandina navbera sepanan, firotina agahiyên kesane an SDK-yên analîtîk bikar naynin, heya ku berî danasîna taybetmendiyekê polîtîka neyê nûkirin.</p><h3>5. Parastin û jêbirina daneyan</h3><p>Daneyên hesabê heta ku hesab çalak e an ji bo pêşkêşkirina servisê pêwîst e tên parastin. Bikarhêner dikare her dem derkeve. Bikarhênerên têketî dikarin ji <strong>Mîheng → Hesab → Hesabê jê bibe</strong> daxwaza jêbirinê bikin. Jêbirin hesab, pêşketin û daneyên girêdayî yên sepanê jê dibe, bi şertê backupên teknîkî an pêdiviyên qanûnî.</p><p>Daneyên mêvanê bi kontrolên resetê an bi jêbirina sepanê ji amûrê dikarin werin rakirin.</p><h3>6. Ewlehî</h3><p>Em Keychain-a platformê ji bo tokenên herêmî û daxwazên rastkirî ji bo hevdemkirina cloudê bikar tînin. Tu rêbazek bi temamî ewle nîn e, lê em tedbîrên maqûl ên guncaw ji bo servisê digirin.</p><h3>7. Zarok</h3><p>Sepan amûrek perwerdehiyê ye û ji bo komkirina agahiyan ji zarokan nehatiye armanc kirin. Bê destûra pêwîst li ser navê zarokekê hesabek çê neke.</p><h3>8. Guhertin</h3><p>Ger sepan an pratîkên daneyan biguherin, em dikarin vê polîtîkayê nû bikin. Versiyona nûkirî dê li heman URL-ê bi dîroka nû were weşandin.</p>`,
 bs:`<span class="card-label">Privatnost</span><h2>Politika privatnosti — Leben in Deutschland</h2><p class="policy-date"><strong>Posljednje ažuriranje:</strong> 27. august 2026.</p><p>Ova politika objašnjava kako Denys Vasyliuk („mi“) obrađuje informacije u aplikaciji <strong>Leben in Deutschland</strong>.</p><h3>1. Šta aplikacija radi</h3><p>Leben in Deutschland je obrazovna aplikacija za vježbanje pitanja, objašnjenja i rječnika te praćenje napretka povezanog s njemačkim integracijskim/testom za državljanstvo.</p><h3>2. Informacije koje obrađujemo</h3><h3>Korištenje kao gost</h3><p>Aplikacija se može koristiti kao gost. Napredak, postavke, oznake i historija vježbanja mogu se čuvati lokalno na uređaju. Podaci gosta se ne sinhronizuju s računom dok se korisnik ne prijavi.</p><h3>Prijava putem Applea ili Googlea</h3><p>Kada se korisnik prijavi putem Applea ili Googlea, pružalac autentifikacije i Supabase stvaraju identifikator računa i sesiju. Ovisno o pružaocu i izboru korisnika, to može uključivati e-mail i ime. Informacije koristimo za autentifikaciju, dostupnost računa i sinhronizaciju napretka između uređaja.</p><h3>Podaci o učenju</h3><p>Kada je sinhronizacija računa uključena, aplikacija može pohraniti napredak, identifikatore odgovorenih/tačnih/netačnih pitanja, oznake, greške, rezultate dijagnostike i probnih ispita, dnevne ciljeve, odabrane jezike, postavke izgleda i druge postavke učenja.</p><h3>Tehnički podaci sesije</h3><p>Tokeni sesije čuvaju se lokalno u Keychainu uređaja i koriste za održavanje prijave i sigurnu komunikaciju sa Supabaseom. Token se ne koristi za oglašavanje ili praćenje.</p><h3>3. Zašto koristimo informacije</h3><p>Informacije koristimo za:</p><ul><li>autentifikaciju i pristup računu;</li><li>sinhronizaciju napretka između uređaja;</li><li>prikaz kataloga, rezultata, oznaka, grešaka i widgeta;</li><li>čuvanje jezičkih i vizuelnih postavki;</li><li>odgovaranje na zahtjeve podrške;</li><li>zaštitu usluge i rješavanje neuspješnih zahtjeva.</li></ul><h3>4. Pružaoci usluga</h3><p>Autentifikaciju i sinhronizaciju u oblaku pruža <strong>Supabase</strong>. Apple i Google mogu obrađivati informacije kada korisnik odabere njihovu prijavu, prema vlastitim politikama privatnosti.</p><p>Aplikacija ne koristi oglašavanje, praćenje između aplikacija, prodaju ličnih podataka ni analitičke SDK-ove, osim ako se ova politika ažurira prije uvođenja takve funkcije.</p><h3>5. Čuvanje i brisanje podataka</h3><p>Podaci računa čuvaju se dok je račun aktivan ili koliko je potrebno za pružanje usluge. Korisnik se može odjaviti u bilo kojem trenutku. Prijavljeni korisnici mogu zatražiti brisanje kroz <strong>Postavke → Račun → Izbriši račun</strong>. Brisanjem se uklanjaju račun, napredak i povezani podaci koje aplikacija obrađuje, uz tehničke sigurnosne kopije ili zakonske obaveze.</p><p>Podaci gosta mogu se ukloniti resetovanjem napretka ili brisanjem aplikacije.</p><h3>6. Sigurnost</h3><p>Za lokalne tokene koristimo Keychain platforme, a za sinhronizaciju autentifikovane zahtjeve. Nijedan način prenosa ili čuvanja nije potpuno siguran, ali primjenjujemo razumne mjere primjerene usluzi.</p><h3>7. Djeca</h3><p>Aplikacija je obrazovni alat i nije namijenjena prikupljanju podataka o djeci. Ne pravite račun u ime djeteta bez potrebne dozvole.</p><h3>8. Promjene</h3><p>Ovu politiku možemo ažurirati kada se promijene aplikacija ili prakse s podacima. Ažurirana verzija bit će objavljena na istoj URL adresi s novim datumom.</p>`,

 طریق <strong>Supabase</strong> ارائه می‌شود. اپل و گوگل هنگام انتخاب روش ورود خود، طبق سیاست‌های حریم خصوصی خود می‌توانند اطلاعات را پردازش کنند.</p><p>برنامه از تبلیغات، ردیابی میان برنامه‌ها، فروش معلومات شخصی یا SDKهای تحلیل استفاده نمی‌کند، مگر اینکه پیش از معرفی چنین قابلیتی این سیاست به‌روزرسانی شود.</p><h3>۵. نگهداری و حذف معلومات</h3><p>معلومات حساب تا زمانی که حساب فعال است یا برای ارائه سرویس نیاز است نگهداری می‌شود. کاربر هر زمان می‌تواند خارج شود. کاربران واردشده می‌توانند از مسیر <strong>تنظیمات → حساب → حذف حساب</strong> درخواست حذف کنند. حذف، حساب، پیشرفت و معلومات مرتبط پردازش‌شده توسط برنامه را حذف می‌کند، با در نظر گرفتن نسخه‌های پشتیبان تخنیکی یا الزامات قانونی.</p><p>معلومات مهمان با کنترل‌های بازنشانی پیشرفت یا حذف برنامه از دستگاه قابل حذف است.</p><h3>۶. امنیت</h3><p>برای ذخیره محلی توکن نشست از Keychain پلتفرم و برای همگام‌سازی ابری از درخواست‌های احراز‌شده استفاده می‌کنیم. هیچ روش انتقال یا ذخیره‌سازی کاملاً امن نیست، اما اقدامات معقول متناسب با سرویس انجام می‌دهیم.</p><h3>۷. کودکان</h3><p>این برنامه یک ابزار آموزشی است و برای جمع‌آوری معلومات از کودکان طراحی نشده است. بدون اجازه لازم از طرف کودک حساب ایجاد نکنید.</p><h3>۸. تغییرات</h3><p>اگر برنامه یا شیوه‌های معلومات تغییر کند، ممکن است این سیاست را به‌روزرسانی کنیم. نسخه به‌روزشده با تاریخ جدید در همان نشانی منتشر خواهد شد.</p>`
